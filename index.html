<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2d2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Brick LCD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">
  <div class="bezel">
    <div class="bezel-top"><span class="led" id="led"></span><span class="brand">BRICK&nbsp;LCD</span></div>
    <div class="screen"><canvas id="lcd"></canvas></div>
    <div class="bezel-caption">СТРОЙКА</div>
  </div>

  <div class="sys">
    <button class="sbtn" data-key="sound"><i></i><span>ЗВУК</span></button>
    <button class="sbtn" data-key="start"><i></i><span>СТАРТ/ПАУЗА</span></button>
    <button class="sbtn" data-key="reset"><i></i><span>СБРОС</span></button>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="btn up" data-key="up"><span>▲</span></button>
      <button class="btn left" data-key="left"><span>◀</span></button>
      <button class="btn right" data-key="right"><span>▶</span></button>
      <button class="btn down" data-key="down"><span>▼</span></button>
    </div>
    <div class="big">
      <button class="btn rotate" data-key="rotate"></button>
      <span class="lbl">ПОВОРОТ</span>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
